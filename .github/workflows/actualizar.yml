name: Actualizar datos de cosecha

# Dos actualizaciones al día (hora de Lima), las dos traen el día de AYER completo:
#   - 4:02 a. m.
#   - 5:03 a. m.  -> vuelve a repasar (recoge lo que se registró tarde o si falló la de las 4:02)
# GitHub puede soltar las tareas con retraso. Cada corrida mira la hora de Lima y no repite
# una actualización que ya se hizo.
# Para cambiar las horas: cambia las dos líneas "cron" (van en hora UTC = Lima + 5 h)
# y también HORA_1 y HORA_2 en el paso "Ver si toca actualizar ahora".

on:
  schedule:
    - cron: "2 9 * * *"     # 4:02 a. m. de Lima (9:02 UTC)
    - cron: "3 10 * * *"    # 5:03 a. m. de Lima (10:03 UTC)
  workflow_dispatch:             # botón "Run workflow" para correrlo a mano, de inmediato
    inputs:
      dias:
        description: "Días hacia atrás a traer (7 = la última semana; 1 = solo ayer)"
        default: "7"
      incluir_hoy:
        description: "Incluir también lo que va de hoy (día incompleto)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Ver si toca actualizar ahora
        id: turno
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Corrida manual: se actualiza ahora."
            echo "correr=si" >> "$GITHUB_OUTPUT"
            echo "hoy=${{ github.event.inputs.incluir_hoy }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Horas de Lima (formato 24 horas, HH:MM) desde las que toca cada actualización
          HORA_1="04:02"
          HORA_2="05:03"
          ahora=$(TZ=America/Lima date +%H:%M)
          dia=$(TZ=America/Lima date +%F)
          echo "En Lima son las $ahora del $dia."
          # "HH:MM" con ceros a la izquierda se puede comparar como texto
          if [ ! "$ahora" \< "$HORA_2" ]; then turno=$HORA_2; hoy=false
          elif [ ! "$ahora" \< "$HORA_1" ]; then turno=$HORA_1; hoy=false
          else echo "Todavía no son las $HORA_1: no toca."; echo "correr=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          marca="$dia-$turno"
          if [ "$(cat ultima_corrida.txt 2>/dev/null)" = "$marca" ]; then
            echo "La actualización de las $turno de hoy ya se hizo: no toca."
            echo "correr=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Toca la actualización de las $turno."
          echo "correr=si" >> "$GITHUB_OUTPUT"
          echo "hoy=$hoy" >> "$GITHUB_OUTPUT"
          echo "marca=$marca" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.turno.outputs.correr == 'si'
        with:
          python-version: "3.12"

      - name: Instalar lo necesario
        if: steps.turno.outputs.correr == 'si'
        run: pip install --quiet selenium openpyxl cryptography

      - name: Descargar de la intranet y actualizar datos.json
        if: steps.turno.outputs.correr == 'si'
        env:
          INTRANET_USUARIO: ${{ secrets.INTRANET_USUARIO }}
          INTRANET_CLAVE: ${{ secrets.INTRANET_CLAVE }}
          ADMIN_CLAVE: ${{ secrets.ADMIN_CLAVE }}
          DIAS_ATRAS: ${{ github.event.inputs.dias || '7' }}   # automático: repasa los últimos 7 días (recoge recojos registrados tarde)
          INCLUIR_HOY: ${{ steps.turno.outputs.hoy }}
          DESCARGAS_DIR: ${{ runner.temp }}/descargas
        run: python actualizar.py

      # Página fitosanitaria: usa el mismo Excel de recepción que se acaba de bajar y la base de fosfina de Drive.
      # Si este paso falla, el Flujo de cosecha se publica igual.
      - name: Actualizar los datos de la página fitosanitaria (fito.json)
        if: steps.turno.outputs.correr == 'si'
        continue-on-error: true
        env:
          ADMIN_CLAVE: ${{ secrets.ADMIN_CLAVE }}
          GOOGLE_CREDENCIALES: ${{ secrets.GOOGLE_CREDENCIALES }}
          DRIVE_CARPETA_ID: ${{ secrets.DRIVE_CARPETA_ID }}
          DIAS_ATRAS: ${{ github.event.inputs.dias || '7' }}   # automático: repasa los últimos 7 días (recoge recojos registrados tarde)
          INCLUIR_HOY: ${{ steps.turno.outputs.hoy }}
          DESCARGAS_DIR: ${{ runner.temp }}/descargas
        run: |
          pip install --quiet google-auth google-api-python-client python-calamine
          python actualizar_fito.py

      - name: Publicar el cambio
        if: steps.turno.outputs.correr == 'si'
        run: |
          # se anota qué actualización quedó hecha, para que los avisos siguientes no la repitan
          marca="${{ steps.turno.outputs.marca }}"
          if [ -n "$marca" ]; then echo "$marca" > ultima_corrida.txt; git add ultima_corrida.txt; fi
          cambio=no
          if ! git diff --quiet -- datos.json; then cambio=si; git add datos.json; fi
          # datos de la página fitosanitaria (la primera vez el archivo todavía no existe en el repositorio)
          if [ -f fito.json ]; then
            git add fito.json
            if ! git diff --cached --quiet -- fito.json; then cambio=si; fi
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git config user.name "actualizacion-automatica"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Actualiza datos (automático $(TZ=America/Lima date '+%d/%m/%Y %H:%M'))"
          git push || { echo "No se pudo guardar: alguien publicó desde la página al mismo tiempo. Vuelve a intentarlo con «Run workflow»."; exit 1; }
          if [ "$cambio" = "si" ]; then
            # pide a GitHub Pages que vuelva a publicar el sitio con los datos nuevos
            curl -sS -o /dev/null -w "Publicación del sitio: respuesta %{http_code}\n" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
