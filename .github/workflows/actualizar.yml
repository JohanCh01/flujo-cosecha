name: Actualizar datos de cosecha

on:
  schedule:
    # La hora va en UTC (Lima + 5). Se programa 5 minutos antes porque GitHub suele arrancar con unos minutos de retraso.
    - cron: "55 12 * * *"       # 7:55 a. m. de Lima -> listo hacia las 8:00: trae el día de AYER completo
    - cron: "55 16 * * *"       # 11:55 a. m. de Lima -> listo hacia las 12:00: refresca ayer y agrega lo que va de HOY
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano
    inputs:
      dias:
        description: "Días hacia atrás a traer (1 = solo ayer)"
        default: "1"
      incluir_hoy:
        description: "Incluir también lo que va de hoy (día incompleto)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lo necesario
        run: pip install --quiet selenium openpyxl cryptography

      - name: Descargar de la intranet y actualizar datos.json
        env:
          INTRANET_USUARIO: ${{ secrets.INTRANET_USUARIO }}
          INTRANET_CLAVE: ${{ secrets.INTRANET_CLAVE }}
          ADMIN_CLAVE: ${{ secrets.ADMIN_CLAVE }}
          DIAS_ATRAS: ${{ github.event.inputs.dias }}
          # la corrida del mediodía (y la manual, si se marca la casilla) incluye el día en curso
          INCLUIR_HOY: ${{ github.event.schedule == '55 16 * * *' || github.event.inputs.incluir_hoy == 'true' }}
          DESCARGAS_DIR: ${{ runner.temp }}/descargas
        run: python actualizar.py

      - name: Publicar el cambio
        run: |
          if git diff --quiet -- datos.json; then
            echo "Sin cambios en datos.json."
            exit 0
          fi
          git config user.name "actualizacion-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add datos.json
          git commit -m "Actualiza datos (automático $(TZ=America/Lima date +%d/%m/%Y))"
          git push || { echo "No se pudo guardar: alguien publicó desde la página al mismo tiempo. Vuelve a ejecutar (Run workflow)."; exit 1; }
          # pide a GitHub Pages que vuelva a publicar el sitio con el datos.json nuevo
          curl -sS -o /dev/null -w "Publicación del sitio: respuesta %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
