name: Stock de paletas

# Corre cuando presionas «Generar tabla» en el Reporte diario (Kilos en stock): la página guarda solicitud_paletas.json en el
# repositorio y ese cambio arranca esta tarea. También se puede correr a mano con «Run workflow».
# Entra a la intranet, descarga el Reporte Lanzado de Paletas (ayer → hoy) y deja la tabla en paletas.json.

on:
  # UNA sola corrida al día: la de las 6:00 a. m. (Lima), que tiene que estar lista antes de las 7:00,
  # porque después empieza el proceso y el stock ya no es el real.
  #   1. La arranca a la hora exacta un servicio externo (cron-job.org) con «Run workflow» y turno = 06:00.
  #   2. Respaldo: avisos de GitHub de 6:00 a 6:55 (GitHub los suelta con retraso). Desde las 7:00 ya no corre sola.
  # Cuando ya hubo una corrida buena en el día (automática o con «Generar tabla»), se rechaza cualquier otra
  # hasta el día siguiente. Solo «Run workflow» con «forzar» marcado la vuelve a correr.
  # Para cambiar las horas, edita HORA y HORA_LIMITE en el paso «Ver si toca correr ahora».
  schedule:
    - cron: "0,5,15,25,35,45,55 11 * * *"   # la hora va en UTC (Lima + 5 h): 11:00 UTC = 6:00 a. m. de Lima
  push:
    paths:
      - solicitud_paletas.json
  workflow_dispatch:
    inputs:
      turno:
        description: "Turno automático (HH:MM, por ejemplo 06:00). Vacío = corrida a mano."
        required: false
        default: ""
      forzar:
        description: "Correr aunque hoy ya se haya hecho la corrida del día"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-paletas
  cancel-in-progress: false

jobs:
  paletas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Ver si toca correr ahora
        id: turno
        run: |
          HORA="06:00"          # corrida automática del día (hora de Lima, 24 h)
          HORA_LIMITE="07:00"   # desde esta hora ya no corre sola (el proceso ya empezó)
          dia=$(TZ=America/Lima date +%F)
          ahora=$(TZ=America/Lima date +%H:%M)
          echo "En Lima son las $ahora del $dia."
          if [ "${{ github.event.inputs.forzar }}" = "true" ]; then
            echo "Forzada a mano desde GitHub: se corre ahora."; echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ¿ya hubo hoy una corrida buena? (fecha y estado van sin cifrar en paletas.json)
          hecha=$(python3 -c "import json,sys; d=json.load(open('paletas.json')); print('si' if str(d.get('gen','')).startswith(sys.argv[1]) and d.get('estado')=='ok' and not d.get('msg') else 'no')" "$dia" 2>/dev/null || echo no)
          if [ "$hecha" = "si" ]; then
            echo "La corrida del día $dia ya se hizo: se bloquea hasta mañana."; echo "correr=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$ahora" \< "$HORA" ] || [ ! "$ahora" \< "$HORA_LIMITE" ]; then
              echo "Fuera del horario automático ($HORA a $HORA_LIMITE): no toca."; echo "correr=no" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "Toca la corrida del día (${{ github.event_name }})."
          echo "correr=si" >> "$GITHUB_OUTPUT"
          echo "marca=$dia-$HORA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.turno.outputs.correr == 'si'
        with:
          python-version: "3.12"

      - name: Instalar lo necesario
        if: steps.turno.outputs.correr == 'si'
        run: pip install --quiet selenium openpyxl cryptography python-calamine

      - name: Descargar de la intranet y armar la tabla
        id: descarga
        if: steps.turno.outputs.correr == 'si'
        env:
          INTRANET_USUARIO: ${{ secrets.INTRANET_USUARIO }}
          INTRANET_CLAVE: ${{ secrets.INTRANET_CLAVE }}
          ADMIN_CLAVE: ${{ secrets.ADMIN_CLAVE }}
          DESCARGAS_DIR: ${{ runner.temp }}/descargas
        run: python paletas.py

      # Se guarda aunque el paso anterior falle: así la página muestra el aviso de error
      - name: Guardar el resultado
        if: always() && steps.turno.outputs.correr == 'si'
        run: |
          if [ ! -f paletas.json ]; then echo "No hay nada que guardar."; exit 0; fi
          # la corrida automática queda anotada solo si salió bien (si falló, el siguiente aviso la repite)
          marca="${{ steps.turno.outputs.marca }}"
          if [ -n "$marca" ] && [ "${{ steps.descarga.outcome }}" = "success" ]; then echo "$marca" > ultima_paletas.txt; git add ultima_paletas.txt; fi
          git add paletas.json
          if git diff --cached --quiet; then echo "Sin cambios que guardar."; exit 0; fi
          git config user.name "actualizacion-automatica"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Stock de paletas ($(TZ=America/Lima date '+%d/%m/%Y %H:%M'))"
          # si otra actualización publicó al mismo tiempo, se trae su cambio y se vuelve a intentar
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -q
          done
          echo "No se pudo guardar después de 5 intentos."; exit 1
